# ==============================================================================
# Micro-Redis High-Availability Docker Compose Setup
# Architecture: 1 Master + 1 Replica + 3 Sentinels + Node.js Express App
# ==============================================================================

services:
  # 1. Primary Redis Master Node
  redis-master:
    image: redis:7-alpine
    container_name: redis-master
    command: redis-server /etc/redis/redis.conf
    volumes:
      - ./docker/redis/redis.conf:/etc/redis/redis.conf:ro
      - redis_master_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - redis-ha-network
    restart: unless-stopped

  # 2. Redis Replica (Slave) Node
  redis-replica:
    image: redis:7-alpine
    container_name: redis-replica
    command: redis-server /etc/redis/redis.conf --replicaof redis-master 6379
    depends_on:
      redis-master:
        condition: service_healthy
    volumes:
      - ./docker/redis/redis.conf:/etc/redis/redis.conf:ro
      - redis_replica_data:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - redis-ha-network
    restart: unless-stopped

  # 3. Redis Sentinel Node 1
  sentinel-1:
    image: redis:7-alpine
    container_name: redis-sentinel-1
    command: >
      sh -c "cp /etc/redis/sentinel.conf /tmp/sentinel.conf &&
             chmod 777 /tmp/sentinel.conf &&
             redis-server /tmp/sentinel.conf --sentinel"
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica:
        condition: service_healthy
    volumes:
      - ./docker/sentinel/sentinel.conf:/etc/redis/sentinel.conf:ro
    ports:
      - "26379:26379"
    networks:
      - redis-ha-network
    restart: unless-stopped

  # 4. Redis Sentinel Node 2
  sentinel-2:
    image: redis:7-alpine
    container_name: redis-sentinel-2
    command: >
      sh -c "cp /etc/redis/sentinel.conf /tmp/sentinel.conf &&
             chmod 777 /tmp/sentinel.conf &&
             redis-server /tmp/sentinel.conf --sentinel"
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica:
        condition: service_healthy
    volumes:
      - ./docker/sentinel/sentinel.conf:/etc/redis/sentinel.conf:ro
    ports:
      - "26380:26379"
    networks:
      - redis-ha-network
    restart: unless-stopped

  # 5. Redis Sentinel Node 3
  sentinel-3:
    image: redis:7-alpine
    container_name: redis-sentinel-3
    command: >
      sh -c "cp /etc/redis/sentinel.conf /tmp/sentinel.conf &&
             chmod 777 /tmp/sentinel.conf &&
             redis-server /tmp/sentinel.conf --sentinel"
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica:
        condition: service_healthy
    volumes:
      - ./docker/sentinel/sentinel.conf:/etc/redis/sentinel.conf:ro
    ports:
      - "26381:26379"
    networks:
      - redis-ha-network
    restart: unless-stopped

  # 6. Micro-Redis Express REST API Service
  cache-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: micro-redis-app
    environment:
      - PORT=3000
      - NODE_ENV=production
      - REDIS_MODE=sentinel
      - REDIS_SENTINEL_MASTER_NAME=mymaster
      - REDIS_SENTINEL_NODES=sentinel-1:26379,sentinel-2:26379,sentinel-3:26379
      - REDIS_CONNECT_TIMEOUT=10000
      - REDIS_MAX_RETRIES=10
    ports:
      - "3000:3000"
    depends_on:
      - sentinel-1
      - sentinel-2
      - sentinel-3
    networks:
      - redis-ha-network
    restart: unless-stopped

volumes:
  redis_master_data:
  redis_replica_data:

networks:
  redis-ha-network:
    driver: bridge
