# ==============================================================================
# Redis Sentinel Configuration for High Availability
# ==============================================================================

port 26379
dir /tmp
protected-mode no

# Monitor the primary Redis master node
# sentinel monitor <master-group-name> <ip/hostname> <port> <quorum>
sentinel monitor mymaster redis-master 6379 2

# Time in ms after which a master is considered down if unreachable
sentinel down-after-milliseconds mymaster 3000

# Timeout in ms after which a failover attempt is considered expired
sentinel failover-timeout mymaster 6000

# Number of replicas that can be reconfigured to use the new master simultaneously
sentinel parallel-syncs mymaster 1

# Hostname resolution support for Docker bridge networks
sentinel resolve-hostnames yes
sentinel announce-hostnames yes
